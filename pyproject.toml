[project]
name = "aimath"
version = "0.1.0"
description = "Local AI mathematician. Lean checks proofs, Mathlib is the library, and LLM agents propose."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "psutil>=6",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["reportlab>=4"]

[project.scripts]
aimath = "aimath.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
